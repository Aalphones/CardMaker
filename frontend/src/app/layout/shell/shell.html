<div class="shell">
  <header class="shell__header">
    <span class="shell__brand">CardMaker</span>
    <div class="shell__account">
      <span class="shell__account-email">{{ auth.user()?.email }}</span>
      <a
        class="shell__tokens-link"
        routerLink="/tokens"
        routerLinkActive="shell__tokens-link--active"
        >Zugriffstoken</a
      >
      <button type="button" class="btn btn--secondary" (click)="logout()">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Abmelden
      </button>
    </div>
  </header>
  <div class="shell__body">
    <nav class="shell__sidebar" aria-label="Hauptnavigation">
      <ul class="shell__nav-list">
        <li>
          <span
            class="shell__nav-link shell__nav-link--disabled"
            aria-disabled="true"
            title="kommt mit dem Karteneditor"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect width="7" height="7" x="3" y="3" rx="1" />
              <rect width="7" height="7" x="14" y="3" rx="1" />
              <rect width="7" height="7" x="14" y="14" rx="1" />
              <rect width="7" height="7" x="3" y="14" rx="1" />
            </svg>
            Alle Karten
          </span>
        </li>
        <li>
          <a
            class="shell__nav-link"
            routerLink="/card-groups"
            routerLinkActive="shell__nav-link--active"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
              />
            </svg>
            Kartengruppen
          </a>
        </li>
        <li>
          <a
            class="shell__nav-link"
            routerLink="/templates"
            routerLinkActive="shell__nav-link--active"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"
              />
              <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" />
              <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" />
            </svg>
            Templates
          </a>
        </li>
        <li>
          <span
            class="shell__nav-link shell__nav-link--disabled"
            aria-disabled="true"
            title="kommt mit dem Druckprojekt"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
              <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6" />
              <rect x="6" y="14" width="12" height="8" rx="1" />
            </svg>
            Druckprojekte
          </span>
        </li>
      </ul>
    </nav>
    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
  <app-notification-list />
</div>
