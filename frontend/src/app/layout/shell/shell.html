<div class="shell">
  <header class="shell__header">
    <span class="shell__product-name">CardMaker</span>
    <div class="shell__user">
      <span class="shell__user-name">{{ auth.user()?.email }}</span>
      <a class="shell__nav-link" routerLink="/tokens" routerLinkActive="shell__nav-link--active"
        >Zugriffstoken</a
      >
      <button type="button" class="shell__logout" (click)="logout()">Abmelden</button>
    </div>
  </header>
  <div class="shell__body">
    <nav class="shell__sidebar" aria-label="Hauptnavigation">
      <a
        class="shell__nav-link"
        routerLink="/card-groups"
        routerLinkActive="shell__nav-link--active"
        >Kartengruppen</a
      >
    </nav>
    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
  <app-notification-list />
</div>
