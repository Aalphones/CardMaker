<div class="stage-controls__zoom">
  <button type="button" class="stage-controls__button" aria-label="Verkleinern" (click)="zoomOut.emit()">−</button>

  <button
    type="button"
    class="stage-controls__value"
    title="Karte einpassen"
    aria-label="Karte einpassen"
    (click)="fitView.emit()"
  >
    {{ zoomPercent() }}%
  </button>

  <button type="button" class="stage-controls__button" aria-label="Vergrößern" (click)="zoomIn.emit()">+</button>

  <button
    type="button"
    class="stage-controls__button"
    disabled
    title="Tastenkürzel — kommen mit der Tastaturbedienung"
    aria-label="Tastenkürzel"
  >
    ?
  </button>
</div>

<p class="stage-controls__status" aria-live="off">{{ statusText() }}</p>
