<div class="dialog asset-picker" role="dialog" aria-labelledby="asset-picker-title">
  <h2 class="dialog__title" id="asset-picker-title">
    {{ data.kind === 'frame' ? 'Rahmen wählen' : 'Icon wählen' }}
  </h2>

  <ul class="asset-picker__list thin-scroll">
    @for (asset of items(); track asset.id) {
      <li>
        <button
          type="button"
          class="asset-picker__row hover-row"
          [class.asset-picker__row--selected]="isSelected(asset.id)"
          (click)="toggle(asset.id)"
        >
          @if (thumbUrl(asset.id); as url) {
            <img class="asset-picker__thumb" [src]="url" [alt]="asset.name" />
          } @else {
            <span class="asset-picker__thumb-placeholder"></span>
          }
          <span class="asset-picker__name">{{ asset.name }}</span>
          @if (isSelected(asset.id)) {
            <svg
              class="asset-picker__check"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          }
        </button>
      </li>
    } @empty {
      <li class="asset-picker__empty">Noch keine Bilder hochgeladen.</li>
    }
  </ul>

  <div
    class="asset-picker__dropzone"
    [class.asset-picker__dropzone--active]="dragActive()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    <label class="asset-picker__dropzone-label" for="asset-picker-file">
      {{ pendingFile()?.name ?? 'Neues PNG hochladen' }}
    </label>
    <input
      id="asset-picker-file"
      class="asset-picker__file-input"
      type="file"
      accept="image/png"
      (change)="onFileSelected($event)"
    />
    @if (assets.uploadFileError(); as message) {
      <p class="asset-picker__upload-error" role="alert">{{ message }}</p>
    }
    @if (pendingFile()) {
      <button type="button" class="btn btn--secondary" [disabled]="assets.uploading()" (click)="upload()">
        {{ assets.uploading() ? 'Lädt hoch …' : 'Hochladen' }}
      </button>
    }
  </div>

  <div class="dialog__actions">
    <button type="button" class="btn btn--primary" (click)="confirm()">Fertig</button>
  </div>
</div>
