<div class="layer-list">
  <div class="layer-list__add-wrapper">
    <app-add-layer-menu [canAddFrame]="canAddFrame()" (add)="add.emit($event)" />
  </div>

  <ul class="layer-list__items thin-scroll" cdkDropList (cdkDropListDropped)="onDrop($event)">
    @for (layer of reversedLayers(); track layer.id) {
      <li
        class="layer-list__item hover-row"
        cdkDrag
        [class.layer-list__item--selected]="layer.id === selectedLayerId()"
      >
        <button
          type="button"
          class="layer-list__visibility icon-button"
          [class.layer-list__visibility--hidden]="!layer.visible"
          [attr.aria-pressed]="layer.visible"
          [attr.aria-label]="(layer.visible ? 'Ebene ausblenden: ' : 'Ebene einblenden: ') + layer.name"
          (click)="toggleVisible.emit(layer.id)"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
            @if (!layer.visible) {
              <line x1="3" y1="3" x2="21" y2="21" />
            }
          </svg>
        </button>

        <span class="layer-list__dot" [class]="dotClass(layer)"></span>

        @if (renamingId() === layer.id) {
          <input
            #renameInput
            type="text"
            class="layer-list__rename-input"
            [value]="layer.name"
            (blur)="commitRename(layer.id, $event)"
            (keydown.enter)="commitRename(layer.id, $event)"
            (keydown.escape)="cancelRename($event)"
          />
        } @else {
          <button
            type="button"
            class="layer-list__name"
            (click)="selectLayer.emit(layer.id)"
            (dblclick)="startRename(layer.id)"
          >
            {{ layer.name }}
          </button>
        }

        <span class="layer-list__type">{{ typeLabel(layer) }}</span>
      </li>
    } @empty {
      <li class="layer-list__empty">Noch keine Ebenen — leg eine an.</li>
    }
  </ul>

  <footer class="layer-list__footer">
    <button
      type="button"
      class="btn btn--ghost layer-list__action"
      [disabled]="!selectedLayerId()"
      (click)="moveSelected(1)"
    >
      ↑ nach vorn
    </button>
    <button
      type="button"
      class="btn btn--ghost layer-list__action"
      [disabled]="!selectedLayerId()"
      (click)="moveSelected(-1)"
    >
      ↓ nach hinten
    </button>
    <button
      type="button"
      class="btn btn--ghost layer-list__action"
      [disabled]="!selectedLayerId()"
      (click)="duplicateSelected()"
    >
      Kopie
    </button>
    <button
      type="button"
      class="btn btn--ghost layer-list__action layer-list__action--danger"
      [disabled]="!selectedLayerId()"
      (click)="removeSelected()"
    >
      Löschen
    </button>
  </footer>
</div>
