@if (geometry()) {
  <form [formGroup]="geometryForm" class="geometry-fields__grid">
    <div class="field">
      <label for="geometry-x">X</label>
      <input id="geometry-x" type="number" class="input" formControlName="x" (change)="emitGeometry()" />
    </div>
    <div class="field">
      <label for="geometry-y">Y</label>
      <input id="geometry-y" type="number" class="input" formControlName="y" (change)="emitGeometry()" />
    </div>
    <div class="field">
      <label for="geometry-width">Breite</label>
      <input id="geometry-width" type="number" class="input" formControlName="width" (change)="emitGeometry()" />
    </div>
    <div class="field">
      <label for="geometry-height">Höhe</label>
      <input id="geometry-height" type="number" class="input" formControlName="height" (change)="emitGeometry()" />
    </div>
  </form>
}
