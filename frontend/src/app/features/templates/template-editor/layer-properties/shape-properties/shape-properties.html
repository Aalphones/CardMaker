<app-geometry-fields [geometry]="geometryOrNull(layer())" (geometryChange)="emitGeometry($event)" />

@if (!isLine()) {
  <app-color-field
    label="Füllung"
    [value]="fillOrNull(layer())"
    [nullable]="true"
    hint="Leer lassen für keine Füllung."
    (valueChange)="emitFill($event)"
  />
}

<app-color-field
  label="Rahmenfarbe"
  [value]="layer().stroke"
  [nullable]="!isLine()"
  (valueChange)="emitStroke($event)"
/>

<form [formGroup]="strokeWidthForm" class="field">
  <label for="shape-stroke-width">Rahmenbreite</label>
  <input id="shape-stroke-width" type="number" class="input" formControlName="strokeWidth" min="0" (change)="emitStrokeWidth()" />
</form>

@if (isLine()) {
  <form [formGroup]="pointsForm" class="shape-properties__grid">
    <div class="field">
      <label for="shape-x1">X1</label>
      <input id="shape-x1" type="number" class="input" formControlName="x1" (change)="emitPoints()" />
    </div>
    <div class="field">
      <label for="shape-y1">Y1</label>
      <input id="shape-y1" type="number" class="input" formControlName="y1" (change)="emitPoints()" />
    </div>
    <div class="field">
      <label for="shape-x2">X2</label>
      <input id="shape-x2" type="number" class="input" formControlName="x2" (change)="emitPoints()" />
    </div>
    <div class="field">
      <label for="shape-y2">Y2</label>
      <input id="shape-y2" type="number" class="input" formControlName="y2" (change)="emitPoints()" />
    </div>
  </form>
}

<app-advanced-fields
  [opacity]="layer().opacity"
  [rotation]="rotationOrNull(layer())"
  [cornerRadius]="cornerRadiusOrNull(layer())"
  (opacityChange)="emitOpacity($event)"
  (rotationChange)="emitRotation($event)"
  (cornerRadiusChange)="emitCornerRadius($event)"
/>
