<app-geometry-fields
  [geometry]="geometryOf(layer())"
  [opacity]="layer().opacity"
  (geometryChange)="layerChange.emit($event)"
  (opacityChange)="layerChange.emit({ opacity: $event })"
/>

<label class="icon-properties__field">
  <span class="icon-properties__label-with-hint">
    Datenquelle
    <app-field-hint
      text="Fest: die Karte zeigt immer dasselbe Icon. Vom Anwender wählbar: beim Anlegen der Karte
      aus den festgelegten Auswahlmöglichkeiten wählen."
    />
  </span>
  <select [value]="layer().source" (change)="onSourceChange($event)">
    <option value="static">Fest</option>
    <option value="user">Vom Anwender wählbar</option>
  </select>
</label>

<div class="icon-properties__field">
  <span>{{ layer().source === 'user' ? 'Standardbild' : 'Bild' }}</span>
  <p class="icon-properties__current">{{ assetName(layer().assetId) ?? 'Kein Bild ausgewählt' }}</p>
  <button type="button" class="icon-properties__button" (click)="pickAsset()">Bild wählen</button>
</div>

@if (layer().source === 'user') {
  <div class="icon-properties__field">
    <span class="icon-properties__label-with-hint">
      Auswahlmöglichkeiten
      <app-field-hint text="Die Icons, aus denen beim Anlegen einer Karte gewählt werden kann." />
    </span>
    <p class="icon-properties__current">
      {{ layer().choiceAssetIds.length }} Bild(er) ausgewählt
    </p>
    <button type="button" class="icon-properties__button" (click)="pickChoices()">Auswahl festlegen</button>
  </div>
}
