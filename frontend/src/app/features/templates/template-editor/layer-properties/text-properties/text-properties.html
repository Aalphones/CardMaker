<app-geometry-fields [geometry]="geometryOf(layer())" (geometryChange)="layerChange.emit($event)" />

<form [formGroup]="form" class="text-properties__grid">
  <div class="field text-properties__field--wide">
    <label for="text-default">{{ form.value.source === 'user' ? 'Vorbelegung' : 'Text' }}</label>
    <textarea id="text-default" class="input" formControlName="defaultText" rows="3" maxlength="500" (change)="emitForm()"></textarea>
  </div>

  <label class="text-properties__checkbox text-properties__field--wide">
    <input type="checkbox" [checked]="form.value.source === 'user'" (change)="onSourceChange($event)" />
    <span class="text-properties__label-with-hint">
      Wird pro Karte ausgefüllt
      <app-field-hint
        text="Aus: der Text steht unveränderlich im Template. An: wird beim Anlegen der Karte
        eingetragen."
      />
    </span>
  </label>

  <div class="field">
    <label for="text-font-family">Schriftart</label>
    <select id="text-font-family" class="input" formControlName="fontFamily" (change)="emitForm()">
      @for (font of fontFamilies; track font) {
        <option [value]="font">{{ font }}</option>
      }
    </select>
  </div>

  <div class="field text-properties__field--size">
    <label for="text-font-size">Größe</label>
    <input id="text-font-size" type="number" class="input" formControlName="fontSize" min="4" max="200" (change)="emitForm()" />
  </div>

  <div class="text-properties__field--wide">
    <span class="text-properties__seg-label">Ausrichtung</span>
    <div class="seg" role="radiogroup" aria-label="Ausrichtung">
      <label class="seg__option">
        <input type="radio" name="text-align" formControlName="align" value="left" (change)="emitForm()" />
        Links
      </label>
      <label class="seg__option">
        <input type="radio" name="text-align" formControlName="align" value="center" (change)="emitForm()" />
        Mitte
      </label>
      <label class="seg__option">
        <input type="radio" name="text-align" formControlName="align" value="right" (change)="emitForm()" />
        Rechts
      </label>
    </div>
  </div>
</form>

<app-color-field label="Textfarbe" [value]="layer().color" (valueChange)="emitColor($event)" />

<app-advanced-fields [opacity]="layer().opacity" [rotation]="layer().rotation" (opacityChange)="emitOpacity($event)" (rotationChange)="emitRotation($event)">
  <form [formGroup]="form" class="text-properties__grid">
    <div class="field text-properties__field--wide">
      <label for="text-key" class="text-properties__label-with-hint">
        Feldschlüssel
        <app-field-hint
          text="Unter diesem Namen liefert die Karteninstanz (und Claude über MCP) den Text.
          Nur a-z, 0-9 und _, muss mit einem Buchstaben beginnen, im Template eindeutig."
        />
      </label>
      <input id="text-key" type="text" class="input" formControlName="key" (change)="emitForm()" />
    </div>

    <div class="text-properties__field--wide">
      <span class="text-properties__seg-label">Vertikale Ausrichtung</span>
      <div class="seg" role="radiogroup" aria-label="Vertikale Ausrichtung">
        <label class="seg__option">
          <input type="radio" name="text-valign" formControlName="verticalAlign" value="top" (change)="emitForm()" />
          Oben
        </label>
        <label class="seg__option">
          <input type="radio" name="text-valign" formControlName="verticalAlign" value="middle" (change)="emitForm()" />
          Mitte
        </label>
        <label class="seg__option">
          <input type="radio" name="text-valign" formControlName="verticalAlign" value="bottom" (change)="emitForm()" />
          Unten
        </label>
      </div>
    </div>

    <div class="field">
      <label for="text-min-font-size" class="text-properties__label-with-hint">
        Mindestgröße
        <app-field-hint text="Unterste Grenze, bis zu der automatisches Verkleinern schrumpfen darf." />
      </label>
      <input id="text-min-font-size" type="number" class="input" formControlName="minFontSize" min="4" max="200" (change)="emitForm()" />
    </div>

    @if (minFontSizeExceedsFontSize()) {
      <p class="text-properties__error" role="alert">
        Die Mindestschriftgröße darf die Schriftgröße nicht überschreiten.
      </p>
    }

    <div class="field">
      <label for="text-line-height" class="text-properties__label-with-hint">
        Zeilenabstand
        <app-field-hint text="Vielfaches der Schriftgröße, z. B. 1.2 für etwas Luft zwischen den Zeilen." />
      </label>
      <input id="text-line-height" type="number" class="input" formControlName="lineHeight" min="0.5" max="3" step="0.1" (change)="emitForm()" />
    </div>

    <label class="text-properties__checkbox text-properties__field--wide">
      <input type="checkbox" formControlName="autoShrink" (change)="emitForm()" />
      <span class="text-properties__label-with-hint">
        Automatisch verkleinern
        <app-field-hint
          text="Ist der Standardtext zu lang für die Box, wird die Schrift automatisch verkleinert —
          bis höchstens zur Mindestschriftgröße."
        />
      </span>
    </label>

    <div class="field">
      <label for="text-outline-width">Umrandungsbreite</label>
      <input id="text-outline-width" type="number" class="input" formControlName="outlineWidth" min="0" (change)="emitForm()" />
    </div>

    <div class="field">
      <label for="text-shadow-blur">Schattenunschärfe</label>
      <input id="text-shadow-blur" type="number" class="input" formControlName="shadowBlur" min="0" (change)="emitForm()" />
    </div>

    <div class="field">
      <label for="text-shadow-offset-x">Schattenversatz X</label>
      <input id="text-shadow-offset-x" type="number" class="input" formControlName="shadowOffsetX" (change)="emitForm()" />
    </div>

    <div class="field">
      <label for="text-shadow-offset-y">Schattenversatz Y</label>
      <input id="text-shadow-offset-y" type="number" class="input" formControlName="shadowOffsetY" (change)="emitForm()" />
    </div>
  </form>

  <app-color-field
    label="Umrandungsfarbe"
    [value]="layer().outlineColor"
    [nullable]="true"
    hint="Leer lassen für keine Umrandung."
    (valueChange)="emitOutlineColor($event)"
  />
  <app-color-field
    label="Schattenfarbe"
    [value]="layer().shadowColor"
    [nullable]="true"
    hint="Leer lassen für keinen Schatten."
    (valueChange)="emitShadowColor($event)"
  />
</app-advanced-fields>
