<app-geometry-fields [geometry]="geometryOf(layer())" (geometryChange)="layerChange.emit($event)" />

<p class="image-properties__hint">Das Bild kommt von der Karte — das Template legt nur den Bereich fest.</p>

<app-advanced-fields
  [opacity]="layer().opacity"
  [rotation]="layer().rotation"
  (opacityChange)="layerChange.emit({ opacity: $event })"
  (rotationChange)="layerChange.emit({ rotation: $event })"
/>
