@if (stageWidth() > 0) {
  <ko-stage #stage class="card-canvas__stage" [config]="stageConfig()" (click)="onStageClick($event)">
    <ko-layer [config]="konvaLayerConfig()">
      @for (item of drawItems(); track item.key) {
        @switch (item.element) {
          @case ('image') {
            <ko-image
              [config]="item.config"
              (click)="selectLayer(item.layerId)"
              (dragstart)="onGestureStart()"
              (transformstart)="onGestureStart()"
              (dragend)="onDragEnd($event)"
              (transformend)="onTransformEnd($event)"
            />
          }
          @case ('rect') {
            <ko-rect
              [config]="item.config"
              (click)="selectLayer(item.layerId)"
              (dragstart)="onGestureStart()"
              (transformstart)="onGestureStart()"
              (dragend)="onDragEnd($event)"
              (transformend)="onTransformEnd($event)"
            />
          }
          @case ('ellipse') {
            <ko-ellipse
              [config]="item.config"
              (click)="selectLayer(item.layerId)"
              (dragstart)="onGestureStart()"
              (transformstart)="onGestureStart()"
              (dragend)="onDragEnd($event)"
              (transformend)="onTransformEnd($event)"
            />
          }
          @case ('line') {
            <ko-line
              [config]="item.config"
              (click)="selectLayer(item.layerId)"
              (dragstart)="onGestureStart()"
              (dragend)="onDragEnd($event)"
            />
          }
          @case ('group') {
            <!-- Nur Kartenbilder: die Gruppe trägt den Zuschnitt, das Kind das Bild. -->
            <ko-group [config]="item.config">
              @for (child of item.children ?? []; track child.key) {
                <ko-image
                  [config]="child.config"
                  (click)="activateImageArea(child.layerId)"
                  (mouseenter)="onCardImageHover(true)"
                  (mouseleave)="onCardImageHover(false)"
                  (wheel)="onCardImageWheel($event, child.layerId)"
                  (dragmove)="onCardImageDragMove($event, child.layerId)"
                  (dragend)="onCardImageDragEnd($event, child.layerId)"
                />
              }
            </ko-group>
          }
          @case ('text') {
            <ko-text
              [config]="item.config"
              (click)="selectLayer(item.layerId)"
              (dragstart)="onGestureStart()"
              (transformstart)="onGestureStart()"
              (dragend)="onDragEnd($event)"
              (transformend)="onTransformEnd($event)"
            />
          }
        }
      }
      <ko-transformer #transformer [config]="transformerConfig()" />
    </ko-layer>
  </ko-stage>
}
