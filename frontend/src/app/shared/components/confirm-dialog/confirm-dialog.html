<div class="dialog" role="alertdialog" aria-labelledby="confirm-dialog-title">
  <h2 class="dialog__title" id="confirm-dialog-title">{{ data.title }}</h2>
  <p class="dialog__body">{{ data.message }}</p>
  <div class="dialog__actions">
    <button type="button" class="btn btn--secondary" (click)="cancel()">
      {{ data.cancelLabel ?? 'Abbrechen' }}
    </button>
    <button type="button" class="btn btn--secondary confirm-dialog__confirm" (click)="confirm()">
      {{ data.confirmLabel ?? 'Löschen' }}
    </button>
  </div>
</div>
