@if (notification.messages().length > 0) {
  <ul class="notification-list" role="status" aria-live="polite">
    @for (message of notification.messages(); track message.id) {
      <li
        class="notification-list__item"
        [class.notification-list__item--error]="message.kind === 'error'"
      >
        <span class="notification-list__text">{{ message.text }}</span>
        <button
          type="button"
          class="notification-list__dismiss icon-button"
          (click)="notification.dismiss(message.id)"
          aria-label="Meldung schließen"
        >
          ×
        </button>
      </li>
    }
  </ul>
}
